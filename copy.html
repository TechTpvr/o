<h1>کد کامل سایت — فقط یک فایل: index.html</h1>

<div><button id="copy">کپی کردن کد</button><a href="org.html">بازگشت به صفحه دو دکمه‌ای</a><span id="status" role="status"></span></div>

<script>
document.getElementById('copy').addEventListener('click',async function(){
 const area=document.getElementById('source');
 try{await navigator.clipboard.writeText(area.value);document.getElementById('status').textContent='کد کامل کپی شد.';}
 catch(e){area.focus();area.select();const ok=document.execCommand('copy');document.getElementById('status').textContent=ok?'کد کامل کپی شد.':'کد انتخاب شد؛ آن را دستی کپی کن.';}
});
</script></body></html>
