<style>
*{box-sizing:border-box} body{margin:0;background:#fff;font-family:"Vazirmatn",Tahoma,sans-serif;color:#222;padding:22px}
.wrap{max-width:1000px;margin:auto} h1{font-size:28px} p{line-height:2}

<h1>کد اصلی سایت — index.html</h1>
<p>برای کپی کردن کد، روی دکمه زیر بزن. سپس می‌توانی آن را در فایل <b>index.html</b> در VS Code قرار بدهی.</p>
<textarea id="source" spellcheck="false">&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;fa&quot; dir=&quot;rtl&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;باشگاه ورزشی بابایی&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
*{box-sizing:border-box}
body{margin:0;background:khaki;color:#222;font-family:&quot;Vazirmatn&quot;,Tahoma,sans-serif;font-size:14px}
header{min-height:112px;background:#a5a5a5;border:3px solid #efa2a2;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 18px}
.logo{width:76px;height:76px;object-fit:contain;border-radius:50%;background:#ddd}
.gym-photo{width:94px;height:84px;object-fit:cover;border-radius:24px}
.site-title{flex:1;text-align:center;font-weight:800;font-size:20px;color:#fff}
nav{background:#77838a;color:#fff;text-align:center;padding:10px;border:3px solid #efa2a2}
nav a{color:#fff;text-decoration:none}
main{margin:8px 0;min-height:245px;background:khaki;border:3px solid #efa2a2;padding:12px;display:flex;gap:14px;align-items:flex-start}
article{flex:1;min-width:0}
.description{line-height:2;text-align:justify;margin:0 0 12px}
.side-photo{width:112px;height:94px;object-fit:cover;border-radius:28px;display:block;margin:4px 0 12px}
.form-area{width:175px;max-width:100%}
form table{width:100%;border-collapse:collapse;background:#f5f5f5}
form td{border:1px solid #888;padding:4px;font-size:12px}
input[type=text],input[type=password]{width:100%;min-width:0;padding:5px;border:1px solid #aaa;font-family:inherit;font-size:12px}
input[type=submit],input[type=reset]{padding:5px 7px;font-family:inherit;font-size:11px;cursor:pointer}
.lower-photo{width:94px;height:86px;object-fit:cover;border-radius:26px}
footer{background:#2456c4;color:#fff;padding:12px 16px;text-align:center;border:3px solid #efa2a2}
footer a{color:white;text-decoration:none;margin-right:8px}
@media(max-width:560px){header{flex-wrap:wrap}.site-title{order:3;flex-basis:100%}main{flex-wrap:wrap}article{flex-basis:100%}.form-area{width:100%}.side-photo{width:90px;height:78px}}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
&lt;img class=&quot;logo&quot; src=&quot;pic/logo.png&quot; alt=&quot;لوگوی باشگاه&quot;&gt;
&lt;div class=&quot;site-title&quot;&gt;باشگاه ورزشی بابایی&lt;/div&gt;
&lt;img class=&quot;gym-photo&quot; src=&quot;pic/sport/s1.jpg&quot; alt=&quot;تصویر باشگاه&quot;&gt;
&lt;/header&gt;
&lt;nav&gt;&lt;a href=&quot;index.html&quot;&gt;صفحه اصلی باشگاه ورزشی بابایی&lt;/a&gt;&lt;/nav&gt;
&lt;main&gt;
&lt;article&gt;
&lt;p class=&quot;description&quot;&gt;به باشگاه ورزشی بابایی خوش آمدید. ورزش و فعالیت بدنی منظم به حفظ سلامتی، افزایش انرژی و بهبود آمادگی جسمانی کمک می‌کند. در این باشگاه می‌توانید تمرین‌های ورزشی خود را در محیطی مناسب انجام دهید و برای رسیدن به تناسب اندام و سلامتی بیشتر تلاش کنید.&lt;/p&gt;
&lt;img class=&quot;lower-photo&quot; src=&quot;pic/sport/s2.jpg&quot; alt=&quot;فضای باشگاه&quot;&gt;
&lt;/article&gt;
&lt;aside class=&quot;form-area&quot;&gt;
&lt;img class=&quot;side-photo&quot; src=&quot;pic/sport/s4.jpg&quot; alt=&quot;تمرین در باشگاه&quot;&gt;
&lt;form action=&quot;#&quot; method=&quot;get&quot;&gt;
&lt;table border=&quot;1&quot; width=&quot;100%&quot;&gt;
&lt;tr&gt;&lt;td&gt;&lt;label for=&quot;name&quot;&gt;نام&lt;/label&gt;&lt;/td&gt;&lt;td&gt;&lt;input id=&quot;name&quot; name=&quot;name&quot; type=&quot;text&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;label for=&quot;password&quot;&gt;کلمه عبور&lt;/label&gt;&lt;/td&gt;&lt;td&gt;&lt;input id=&quot;password&quot; name=&quot;password&quot; type=&quot;password&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td colspan=&quot;2&quot; style=&quot;text-align:center&quot;&gt;&lt;input type=&quot;submit&quot; value=&quot;ثبت نام&quot;&gt; &lt;input type=&quot;reset&quot; value=&quot;پاک کردن&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/table&gt;
&lt;/form&gt;
&lt;/aside&gt;
&lt;/main&gt;
&lt;footer&gt;تمامی حقوق سایت محفوظ می‌باشد. | &lt;a href=&quot;contact.html&quot;&gt;تماس با ما&lt;/a&gt;&lt;/footer&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
<div><button id="copy">کپی کردن کد</button><a href="org.html">بازگشت</a><span id="status" role="status"></span></div>
</main>
<script>
document.getElementById('copy').addEventListener('click', async function(){
 const area=document.getElementById('source');
 try{ await navigator.clipboard.writeText(area.value); document.getElementById('status').textContent='کد با موفقیت کپی شد.'; }
 catch(e){ area.focus(); area.select(); const ok=document.execCommand('copy'); document.getElementById('status').textContent=ok?'کد با موفقیت کپی شد.':'کد انتخاب شد؛ آن را دستی کپی کنید.'; }
});
</script>
</body></html>
